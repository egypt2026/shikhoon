<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>منيو شيخون فوودز</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f2ee;--card:#fff;--ink:#2b1d17;--mut:#7a6a62;--brand:#653c2b;--green:#0b5a45;--rust:#8a4030;--line:#e6ddd5;--sale:#c0392b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#1b1411;--card:#261c17;--ink:#f1e8e1;--mut:#b5a398;--line:#3a2d26;--green:#5fcf9f;--rust:#e0907c;--sale:#ff7b6b}}
:root[data-theme=dark]{--bg:#1b1411;--card:#261c17;--ink:#f1e8e1;--mut:#b5a398;--line:#3a2d26;--green:#5fcf9f;--rust:#e0907c;--sale:#ff7b6b}
*{box-sizing:border-box}html{scroll-padding-top:120px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Cairo,Tahoma,sans-serif;padding-bottom:90px}
header{background:#653a2b;color:#fff;text-align:center;padding:0 16px 14px;border-radius:0 0 28px 28px}
.lg{display:block;width:min(170px,46vw);height:auto;margin:0 auto;padding-top:calc(14px + env(safe-area-inset-top,0px))}
header p{margin:0 0 12px;color:#e8c9a8}
#q{width:100%;max-width:520px;border:0;border-radius:12px;padding:11px 14px;font:inherit;background:#fff;color:#2b1d17}
nav{position:sticky;top:0;z-index:5;display:flex;gap:8px;justify-content:center;overflow-x:auto;padding:10px;background:var(--bg)}
nav a{white-space:nowrap;padding:7px 16px;border-radius:99px;border:1.5px solid var(--rust);color:var(--rust);text-decoration:none;font-weight:600}
main{max-width:720px;margin:0 auto;padding:0 12px}
h2{margin:20px 0 10px;padding:10px 12px;text-align:center;color:#fff;font-size:1.4rem;font-weight:800;border-radius:12px;background:var(--c);border:1px solid #fff3}
.row{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.nm{flex:1;font-weight:600}
.pr{display:flex;flex-direction:column;align-items:flex-end;min-width:76px;line-height:1.25}
.pr b{color:var(--rust);font-size:1.05rem}.pr b.sale{color:var(--sale)}
.pr s{color:var(--mut);font-size:.8rem}
.pr small{color:var(--mut);font-size:.72rem}
.pr em{font-style:normal;background:var(--sale);color:#fff;font-size:.72rem;padding:0 7px;border-radius:99px}
button{font:inherit;cursor:pointer}
.add{background:var(--brand);color:#fff;border:0;border-radius:10px;padding:6px 16px;min-width:64px}
.st{display:flex;align-items:center;gap:6px}
.st small{font-weight:400;font-size:.7rem}
.st button{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--brand);background:none;color:var(--ink);font-size:1.1rem;line-height:1}
.st span{min-width:46px;white-space:nowrap;text-align:center;font-weight:800}
.empty{text-align:center;color:var(--mut);padding:30px}
#fab{position:fixed;inset-inline:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));max-width:696px;margin:auto;display:flex;justify-content:space-between;background:var(--green);color:#fff;border:0;border-radius:14px;padding:13px 18px;z-index:6;box-shadow:0 6px 18px #0004}
:root[data-theme=dark] #fab,:root:not([data-theme=light]) #fab{color:#0d1f19}
@media(prefers-color-scheme:light){:root:not([data-theme=dark]) #fab{color:#fff}}
#sh{position:fixed;inset:0;background:#0007;z-index:9;display:none;align-items:flex-end;justify-content:center}
#sh.on{display:flex}
.sheet{background:var(--bg);width:100%;max-width:720px;max-height:88vh;overflow:auto;border-radius:20px 20px 0 0;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.sheet h3{margin:0 0 8px;display:flex;justify-content:space-between}
.sheet h3 button{background:none;border:0;color:var(--ink);font-size:1.4rem}
.ln{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}.ln span{flex:1}
.tt{display:flex;justify-content:space-between;font-size:1.2rem;padding:12px 0;font-weight:800}.tt b{color:var(--rust)}
.sv{color:var(--sale);margin:6px 0;font-weight:600}
.sheet input,.sheet textarea{width:100%;margin-top:8px;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit}
#err{color:var(--sale);min-height:1.4em;margin:6px 0 0}
.send{width:100%;margin-top:8px;background:#128c4a;color:#fff;border:0;border-radius:12px;padding:13px;font-weight:800;font-size:1.05rem}
</style></head><body>

function sheet(){const e=Object.entries(cart);if(!e.length)return shut();const sv=e.reduce((a,[k,v])=>a+(items[k].o?(items[k].o-items[k].p)*v:0),0);
$('#shb').innerHTML=e.map(([k,v])=>`<div class="ln"><span>${items[k].n}</span>${stp(k,v)}<b>${f(items[k].p*v)}</b></div>`).join('')+(sv>0?`<p class="sv">وفّرت ${f(sv)} ج.م</p>`:'')+`<div class="tt">الإجمالي <b>${f(tot())} ج.م</b></div>`}
function ch(id,d){cart[id]=Math.max(0,(cart[id]||0)+d);if(!cart[id])delete cart[id];draw();sheet()}
function shut(){$('#sh').classList.remove('on')}
$('#fab').onclick=()=>{sheet();$('#sh').classList.add('on')};
$('#q').oninput=e=>{q=e.target.value.trim();draw()};
function send(){const n=$('#nm').value.trim(),a=$('#ad').value.trim();if(!n){$('#err').textContent='اكتب اسمك قبل إرسال الطلب.';return}$('#err').textContent='';
const m=`*طلب جديد - شيخون فوودز*\nالاسم: ${n}\n`+(a?`العنوان/ملاحظات: ${a}\n`:'')+`\n*الطلب:*\n`+Object.entries(cart).map(([k,v])=>`• ${items[k].n} × ${v} كجم = ${f(items[k].p*v)} ج.م`).join('\n')+`\n\n*الإجمالي: ${f(tot())} ج.م*`;
const u='https://wa.me/'+WA+'?text='+encodeURIComponent(m);window.open(u,'_blank')||(location.href=u)}
draw();
// للتحديث التلقائي: انشر شيت Google Sheets بصيغة CSV وضع الرابط هنا (يعمل عند استضافة الصفحة على موقعك مثل GitHub Pages)
const CSV_URL='https://docs.google.com/spreadsheets/d/e/2PACX-1vRaB50wv9Sac6SGKJxCe4VV-hwPw1Mu5rHxBsANdmiAnkpDO8OBhgl0CsWAhNnciGGkGK4tRv5rXbr5/pub?gid=560607079&single=true&output=csv';
const toNum=x=>+String(x||'').replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[^\d.]/g,'')||0;
function csv(t){const R=[];let r=[],c='',q=0;for(let i=0;i<t.length;i++){const h=t[i];if(q){if(h=='"'){if(t[i+1]=='"'){c+='"';i++}else q=0}else c+=h}else if(h=='"')q=1;else if(h==','){r.push(c);c=''}else if(h=='\n'||h=='\r'){if(h=='\r'&&t[i+1]=='\n')i++;r.push(c);c='';R.push(r);r=[]}else c+=h}if(c||r.length){r.push(c);R.push(r)}return R}
async function sync(){if(!CSV_URL)return;try{const r=await fetch(CSV_URL+(CSV_URL.includes('?')?'&':'?')+'t='+Date.now());const R=csv(await r.text()).slice(1).filter(x=>x[1]&&toNum(x[2])>0);const ns=S.map(s=>[]),nI=[];
R.forEach(x=>{const k=S.findIndex(s=>s.t.replace('قسم ','')===x[0].trim());if(k<0)return;let p=toNum(x[2]),o=toNum(x[3]);if(G>0&&!o){o=p;p=+(p*(1-G/100)).toFixed(2)}const i={id:nI.length,n:x[1].trim(),p,o:o>p?o:0};nI.push(i);ns[k].push(i)});
if(nI.length){S.forEach((s,k)=>s.items=ns[k]);items=nI;cart={};draw();sheet()}}catch(e){}}
sync();
</script></body></html>
